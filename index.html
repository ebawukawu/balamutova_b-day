    <!-- ===== ПИКСЕЛЬНЫЙ ШРИФТ 90-Х ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* ===== ГЛОБАЛЬНЫЕ СБРОСЫ И БАЗА ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
        }

        html {
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
        }

        /* ===== КАЖДЫЙ БЛОК — НА ВСЮ ВЫСОТУ ЭКРАНА ===== */
        /* 
            ФИКС: используем 100svh вместо min-height: 100vh
            На мобильных 100vh включает адресную строку браузера
            и контент обрезается. svh = small viewport height = 
            высота без браузерного UI — работает корректно.
        */
        .full-screen {
            height: 100svh; /* ← ФИКС для мобильных */
            min-height: 600px; /* запасной минимум для старых браузеров */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 20px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
            scroll-snap-align: start;
        }

        /* ===== ФОНОВЫЕ ЭФФЕКТЫ ===== */
        .block-1 {
            background: radial-gradient(circle at 20% 30%, #1a0a2e, #0a0a0a);
        }
        .block-1::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 40px,
                rgba(255, 0, 255, 0.03) 40px,
                rgba(255, 0, 255, 0.03) 41px
            );
            animation: scan 10s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes scan {
            0%   { transform: translateY(0); }
            100% { transform: translateY(80px); }
        }

        .block-2 { background: radial-gradient(circle at 80% 70%, #1a1a2e, #0d0d1a); }
        .block-3 { background: radial-gradient(circle at 50% 50%, #2a0a1a, #0a0a0a); }
        .block-4 { background: radial-gradient(circle at 30% 80%, #0a1a2e, #0a0a0a); }
        .block-5 { background: radial-gradient(circle at 70% 20%, #1a2a0a, #0a0a0a); }

        /* Контент поверх фона */
        .block-content {
            position: relative;
            z-index: 2;
            max-width: 750px;
            width: 100%;
            max-height: calc(100svh - 100px);
            overflow-y: auto;
            /* скрываем скроллбар внутри блока, но скролл работает */
            scrollbar-width: none;
        }
        .block-content::-webkit-scrollbar { display: none; }

        /* ===== БОКОВЫЕ ЭЛЕМЕНТЫ (декор 90-х) ===== */
        .side-decor {
            position: absolute;
            z-index: 1;
            font-size: clamp(2rem, 4vw, 3.5rem);
            opacity: 0.25;
            animation: floatSlow 6s ease-in-out infinite;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(0 0 20px rgba(255, 0, 255, 0.2));
            /* ОПТИМИЗАЦИЯ: подсказка браузеру что будет анимация */
            will-change: transform;
        }
        .side-decor:nth-child(1) { top: 10%;    left: 3%;   animation-delay: 0s; }
        .side-decor:nth-child(2) { top: 25%;    right: 3%;  animation-delay: 1s; }
        .side-decor:nth-child(3) { bottom: 30%; left: 2%;   animation-delay: 2s; }
        .side-decor:nth-child(4) { bottom: 15%; right: 2%;  animation-delay: 0.5s; }
        .side-decor:nth-child(5) { top: 50%;    left: 1%;   animation-delay: 1.5s; font-size: clamp(1.5rem, 3vw, 2.5rem); }
        .side-decor:nth-child(6) { top: 60%;    right: 1%;  animation-delay: 2.5s; font-size: clamp(1.5rem, 3vw, 2.5rem); }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px)   rotate(0deg); }
            50%       { transform: translateY(-15px) rotate(5deg); }
        }

        /* ===== БЕГУЩАЯ СТРОКА (привет из 90-х!) ===== */
        .marquee-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(0,0,0,0.85);
            border-bottom: 1px solid #ff00ff;
            padding: 6px 0;
            overflow: hidden;
        }
        .marquee-bar marquee {
            color: #ff00ff;
            font-size: 0.75rem;
            letter-spacing: 2px;
        }

        /* ===== НАВИГАЦИОННЫЕ ТОЧКИ (боковые) ===== */
        .nav-dots {
            position: fixed;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 500;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .nav-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 0, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }
        .nav-dot:hover,
        .nav-dot.active {
            background: #ff00ff;
            box-shadow: 0 0 12px #ff00ff;
            transform: scale(1.3);
        }

        /* ===== ПЛАВАЮЩАЯ КНОПКА «ИДУ!» ===== */
        .float-btn {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 500;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            padding: 12px 28px;
            border-radius: 30px;

            font-weight: bold;

            box-shadow: 0 0 30px rgba(255, 0, 255, 0.4);

            will-change: transform, box-shadow;

            animation: none;
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 0 50px rgba(255, 0, 255, 0.6);
        }
        /* Скрываем кнопку когда пользователь на блоке с формой */
        .float-btn.hidden { opacity: 0; pointer-events: none; }

        @keyframes pulse {
            0%, 100% { 
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 30px rgba(255, 0, 255, 0.4);
            }

<script>
    /* ============================================================
       1. ОБРАТНЫЙ ОТСЧЁТ
       ============================================================ */
    function updateCountdown() {
        // Дата вечеринки: 12 сентября 2026, 16:00, Москва (UTC+3)
        const target = new Date('2026-09-12T16:00:00+03:00');
        const now    = new Date();
        const diff   = target - now;

        if (diff <= 0) {
            // Уже началось!
            document.getElementById('cd-days').textContent  = '00';
            document.getElementById('cd-hours').textContent = '00';
            document.getElementById('cd-mins').textContent  = '00';
            document.getElementById('cd-secs').textContent  = '00';
            return;
        }

        const days  = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins  = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const secs  = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('cd-days').textContent  = String(days).padStart(3, '0');
        document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
        document.getElementById('cd-mins').textContent  = String(mins).padStart(2, '0');
        document.getElementById('cd-secs').textContent  = String(secs).padStart(2, '0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);


    /* ============================================================
       2. НАВИГАЦИОННЫЕ ТОЧКИ — подсвечиваются при скролле
       ============================================================ */
    const sections = document.querySelectorAll('.full-screen');
    const dots     = document.querySelectorAll('.nav-dot');
    const floatBtn = document.getElementById('floatBtn');

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (!entry.isIntersecting) return;

            const idx = Array.from(sections).indexOf(entry.target);

            // Обновляем точки
            dots.forEach((d, i) => {
                d.classList.toggle('active', i === idx);
            });

            // Скрываем кнопку «Подтвердить участие» на блоке с формой
            floatBtn.classList.toggle('hidden', idx === sections.length - 1);
        });
    }, { threshold: 0.5 });

    sections.forEach(s => observer.observe(s));


    /* ============================================================
       3. МНОГОШАГОВАЯ ФОРМА
       ============================================================ */
    let currentStep = 0;
    const totalSteps = 3;

    function updateProgress(step) {
        for (let i = 0; i < totalSteps; i++) {
            const dot = document.getElementById('dot-' + i);
            if (i < step)       { dot.className = 'progress-dot done'; }
            else if (i === step){ dot.className = 'progress-dot active'; }
            else                { dot.className = 'progress-dot'; }
        }

        const titles = [
            '📝 Подтверди участие',
            '📋 Детали',
            '💬 Почти готово!'
        ];
        document.getElementById('formTitle').textContent = titles[step];
    }

    function nextStep(step) {
        // Валидация текущего шага
        const currentInputs = document.querySelectorAll(
            '#step-' + currentStep + ' [required]'
        );
        let valid = true;
        currentInputs.forEach(input => {
            if (!input.value.trim()) {
                input.style.borderColor = '#ff4444';
                input.style.boxShadow   = '0 0 15px rgba(255,68,68,0.3)';
                valid = false;
                // Убираем красный бордер через 2 секунды
                setTimeout(() => {
                    input.style.borderColor = '#333';
                    input.style.boxShadow   = 'none';
                }, 2000);
            }
        });
        if (!valid) return;

        // Скрываем текущий шаг, показываем следующий
        document.getElementById('step-' + currentStep).classList.remove('active');
        document.getElementById('step-' + step).classList.add('active');
        currentStep = step;
        updateProgress(step);
    }

    function prevStep(step) {
        document.getElementById('step-' + currentStep).classList.remove('active');
        document.getElementById('step-' + step).classList.add('active');
        currentStep = step;
        updateProgress(step);
    }


    /* ============================================================
       4. ОТПРАВКА ФОРМЫ В GOOGLE FORMS
          Отправляем в скрытый iframe → страница не перезагружается
          → показываем экран успеха.
       ============================================================ */
    const form          = document.getElementById('rsvpForm');
    const successScreen = document.getElementById('successScreen');
    const formProgress  = document.getElementById('formProgress');
    const formTitle     = document.getElementById('formTitle');
    const hiddenIframe  = document.getElementById('hidden_iframe');

    // Когда iframe загрузился (= форма отправлена) — показываем успех
    hiddenIframe.addEventListener('load', function() {
        // Первая загрузка iframe пустая, игнорируем
        if (!form.dataset.submitted) return;

        // Прячем форму, прогресс и заголовок
        form.style.display           = 'none';
        formProgress.style.display   = 'none';
        formTitle.style.display      = 'none';

        // Показываем экран успеха
        successScreen.classList.add('show');

        // Скрываем плавающую кнопку
        floatBtn.classList.add('hidden');
    });

    form.addEventListener('submit', function(e) {
        // Помечаем что отправка произошла намеренно
        form.dataset.submitted = 'true';

        // Блокируем кнопку чтобы не отправили дважды
        const btn = document.getElementById('submitBtn');
        btn.disabled     = true;
        btn.textContent  = '⏳ Отправляем...';

        // form отправится в hidden_iframe через target="hidden_iframe"
        // ничего больше не нужно — просто даём форме отправиться
    });


    /* ============================================================
       5. ПЛАВНАЯ ПРОКРУТКА ДЛЯ СТРЕЛОК И ТОЧЕК
          (на случай если scroll-behavior:smooth не сработал)
       ============================================================ */
    document.querySelectorAll('a[href^="#"]').forEach(link => {
        link.addEventListener('click', function(e) {
            const target = document.querySelector(this.getAttribute('href'));
            if (!target) return;
            e.preventDefault();
            target.scrollIntoView({ behavior: 'smooth' });
        });
    });
</script>

</body>
</html>
